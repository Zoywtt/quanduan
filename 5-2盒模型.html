<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型.框模型</title>
    <style>
        body,yl,p,h1,h2,h3,h4,h5,h6{
            margin: 0;
            padding: 0;
        }
        .a{
            width: 500px;
            height: 500px;
            border: 2px dotted blue;
            padding: 70px 60px 50px 40px;
            margin: 40px auto;
        }
        .b{
            width: 500px;
            height: 300px;
            border: 2px dotted red;
            margin: 50px auto 40px;
        }
        .c{
            border: 2px solid green;
            padding: 70px 60px 50px 40px;
            margin: 40px auto;
        
        }
    </style>
</head>
<body>
    <div class="a">903张耀夫</div>
    <div class="b">903张耀夫</div>
    <div class="c">903张耀夫</div>

</body>
</html>
