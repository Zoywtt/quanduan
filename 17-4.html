<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-4 汽车行情 Tab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            font-size: 13px;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* ============ 页面容器 ============ */
        .zyf_wrap {
            max-width: 560px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 4px;
            overflow: hidden;
        }

        /* ============ Tab 选项卡 ============ */
        .zyf_tabs {
            display: flex;
            border-bottom: 2px solid #e5e5e5;
        }
        .zyf_tab {
            padding: 14px 24px;
            font-size: 14px;
            font-weight: 400;
            color: #666;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
            user-select: none;
            background: #fff;
            border: none;
        }
        .zyf_tab:hover { color: #e1251b; }
        .zyf_tab.zyf_active {
            color: #e1251b;
            font-weight: 700;
        }
        /* active 底部红色下划线 */
        .zyf_tab.zyf_active::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: -2px;
            height: 2px;
            background: #e1251b;
        }

        /* ============ 表格 ============ */
        .zyf_table_wrap { padding: 4px 0; }
        .zyf_table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .zyf_table thead th {
            padding: 10px 16px;
            font-size: 12px;
            color: #999;
            font-weight: 400;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        .zyf_table tbody td {
            padding: 12px 16px;
            font-size: 13px;
            color: #333;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
            transition: background 0.15s;
        }
        .zyf_table tbody tr:last-child td { border-bottom: none; }
        .zyf_table tbody tr:hover td { background: #fafafa; }

        /* 列宽 */
        .zyf_table .zyf_col_date  { width: 80px;  color: #999; font-size: 12px; }
        .zyf_table .zyf_col_model { color: #333; }
        .zyf_table .zyf_col_price { width: 120px; text-align: right; color: #e1251b; font-weight: 600; font-family: "Consolas", monospace; }

        /* Tab 面板切换 */
        .zyf_panel { display: none; }
        .zyf_panel.zyf_active { display: block; }

        /* ============ 标题说明 ============ */
        .zyf_header {
            max-width: 560px;
            margin: 0 auto 14px;
            text-align: left;
        }
        .zyf_header h1 { font-size: 16px; color: #333; font-weight: 600; }
        .zyf_header p { font-size: 12px; color: #999; margin-top: 4px; }

        /* ============ 点击弹出详情 ============ */
        .zyf_detail {
            margin-top: 16px;
            max-width: 560px;
            margin-left: auto; margin-right: auto;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 4px;
            padding: 16px 20px;
            font-size: 12.5px;
            color: #666;
            line-height: 2;
            display: none;
        }
        .zyf_detail.zyf_show { display: block; }
        .zyf_detail b { color: #e1251b; }
    </style>
</head>
<body>

    <div class="zyf_header">
        <h1>汽车行情 · 新车上市</h1>
        <p>点击表格行可查看详情</p>
    </div>

    <div class="zyf_wrap">
        <!-- ========== Tab 栏 ========== -->
        <div class="zyf_tabs">
            <button class="zyf_tab zyf_active" data-tab="latest" onclick="zyf_switchTab('latest')">最新上市</button>
            <button class="zyf_tab" data-tab="upcoming" onclick="zyf_switchTab('upcoming')">即将上市</button>
        </div>

        <!-- ========== 面板 1：最新上市 ========== -->
        <div class="zyf_panel zyf_active" id="zyf_panel_latest">
            <div class="zyf_table_wrap">
                <table class="zyf_table">
                    <thead>
                        <tr>
                            <th class="zyf_col_date">上市时间</th>
                            <th class="zyf_col_model">品牌/车型</th>
                            <th class="zyf_col_price">售价（万元）</th>
                        </tr>
                    </thead>
                    <tbody id="zyf_tbody_latest">
                        <!-- JS 渲染 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ========== 面板 2：即将上市 ========== -->
        <div class="zyf_panel" id="zyf_panel_upcoming">
            <div class="zyf_table_wrap">
                <table class="zyf_table">
                    <thead>
                        <tr>
                            <th class="zyf_col_date">预计时间</th>
                            <th class="zyf_col_model">品牌/车型</th>
                            <th class="zyf_col_price">预计售价（万元）</th>
                        </tr>
                    </thead>
                    <tbody id="zyf_tbody_upcoming">
                        <!-- JS 渲染 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ============ 点击详情 ============ -->
    <div class="zyf_detail" id="zyf_detail"></div>

    <script>
        // ============ 数据 ============
        var zyf_latest = [
            { date: "12月13日", model: "沃尔沃S60L",          price: "26.99-38.49" },
            { date: "12月12日", model: "牧马人龙腾典藏",      price: "47.99-59.99" },
            { date: "12月10日", model: "一汽大众高尔夫7",     price: "11.89-18.29" },
            { date: "12月8日",  model: "2014款古思特",        price: "419.0-666.0" },
            { date: "12月5日",  model: "起亚新款K5",          price: "15.98-28.18" },
            { date: "12月5日",  model: "2014款奥迪赛",        price: "22.98-28.68" }
        ];
        var zyf_upcoming = [
            { date: "1月中旬",  model: "全新一代帕萨特",      price: "18.99-28.99" },
            { date: "1月下旬",  model: "改款宝马3系",         price: "30.99-45.99" },
            { date: "2月初",    model: "长安CS85 COUPE",      price: "13.99-18.99" },
            { date: "2月中旬",  model: "全新丰田卡罗拉双擎",  price: "13.98-17.98" },
            { date: "2月底",    model: "领克03 高性能版",     price: "25.98-35.98" }
        ];

        // ============ 渲染 ============
        function zyf_render() {
            zyf_renderBody("zyf_tbody_latest",   zyf_latest);
            zyf_renderBody("zyf_tbody_upcoming", zyf_upcoming);
        }
        function zyf_renderBody(id, list) {
            var tbody = document.getElementById(id);
            tbody.innerHTML = "";
            for (var i = 0; i < list.length; i++) {
                var car = list[i];
                var tr = document.createElement("tr");
                tr.innerHTML =
                    '<td class="zyf_col_date">' + car.date + '</td>' +
                    '<td class="zyf_col_model">' + car.model + '</td>' +
                    '<td class="zyf_col_price">' + car.price + '</td>';
                tr.onclick = (function(car) {
                    return function() { zyf_showDetail(car); };
                })(car);
                tbody.appendChild(tr);
            }
        }

        // ============ Tab 切换 ============
        function zyf_switchTab(name) {
            // Tab 按钮状态
            var tabs = document.getElementsByClassName("zyf_tab");
            for (var i = 0; i < tabs.length; i++) {
                tabs[i].classList.toggle("zyf_active", tabs[i].getAttribute("data-tab") === name);
            }
            // 面板状态
            var panels = document.getElementsByClassName("zyf_panel");
            for (var j = 0; j < panels.length; j++) {
                panels[j].classList.toggle("zyf_active", panels[j].id === "zyf_panel_" + name);
            }
            // 切换 tab 时关闭详情
            document.getElementById("zyf_detail").classList.remove("zyf_show");
        }

        // ============ 点击详情 ============
        function zyf_showDetail(car) {
            var panel = document.getElementById("zyf_panel_latest").classList.contains("zyf_active")
                ? "最新上市" : "即将上市";
            document.getElementById("zyf_detail").innerHTML =
                "🚗 <b>" + car.model + "</b><br>" +
                "　所属分类：" + panel + "<br>" +
                "　时间：" + car.date + "<br>" +
                "　售价区间：<b>" + car.price + " 万元</b><br>" +
                "<span style='color:#999'>（这是一个交互演示 · 仅作课堂用）</span>";
            document.getElementById("zyf_detail").classList.add("zyf_show");
        }

        // 初始化
        zyf_render();
    </script>
</body>
</html>
