<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    /*全局CSS*/
    *{margin: 0;padding: 0;}
    ul{list-style: none;}
    img{
        display: block;
    }
    .slist{
        display: flex;
    }
    .slist li{
        width: 30%;
        margin-right: 3px;
        flex-grow: 1;
        position: relative;
    }
    .slist li img{
        width: 100%;

    }
    .slist li p{
        font-size: 14px;
        text-align: center;
        font-height: 24px;
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        color: #fff;
        font-weight: bold;
    }
    </style>
</head>
<body>
 <ul class="slist">
    <li>
        <img src="./img/1.jpg" alt="1.jpg">
        <p>张耀夫的标题</p>
    </li>
    <li>
        <img src="./img/2.jpg" alt="2.jpg">
        <p>张耀夫的标题</p>
    </li>
    <li>
        <img src="./img/3.jpg" alt="3.jpg">
        <p>张耀夫的标题</p>
    </li>
 </ul>   
</body>
</html>
