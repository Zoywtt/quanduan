<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-1-3 响应式布局 张耀夫</title>
    <style>
        *{ margin: 0; padding: 0; box-sizing: border-box; }

        body{
            background: radial-gradient(ellipse at top, #1a1a3e, #0f0f1e 70%);
            min-width: 320px;
            font-family: "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 3vh;
        }

        /* 浮动光球 */
        .orb{
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.3;
        }
        .orb-1{ width: 400px; height: 400px; background: #7b2ff7; top: -100px; right: -100px; }
        .orb-2{ width: 300px; height: 300px; background: #00d9f5; bottom: -50px; left: -50px; }

        h1{
            position: relative;
            z-index: 1;
            text-align: center;
            font-size: 28px;
            background: linear-gradient(135deg, #e94560, #a855f7, #00d9f5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }
        .subtitle{
            position: relative;
            z-index: 1;
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .grid{
            position: relative;
            z-index: 1;
            display: grid;
            gap: 20px;
            padding: 20px;
            width: 100%;
            max-width: 1400px;
        }

        /* 默认：移动端 1列 */
        .grid{ grid-template-columns: 1fr; }
        /* 平板 2列 */
        @media (min-width: 480px){ .grid{ grid-template-columns: repeat(2, 1fr); } }
        /* 小桌面 4列 */
        @media (min-width: 768px){ .grid{ grid-template-columns: repeat(4, 1fr); } }
        /* 大桌面 8列 */
        @media (min-width: 1024px){ .grid{ grid-template-columns: repeat(8, 1fr); } }

        .box{
            height: 160px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            color: white;
            position: relative;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), box-shadow 0.4s ease;
            animation: boxIn 0.6s ease backwards;
        }
        .box:nth-child(1){ animation-delay: 0.05s; }
        .box:nth-child(2){ animation-delay: 0.1s; }
        .box:nth-child(3){ animation-delay: 0.15s; }
        .box:nth-child(4){ animation-delay: 0.2s; }
        .box:nth-child(5){ animation-delay: 0.25s; }
        .box:nth-child(6){ animation-delay: 0.3s; }
        .box:nth-child(7){ animation-delay: 0.35s; }
        .box:nth-child(8){ animation-delay: 0.4s; }
        @keyframes boxIn{ from{ opacity: 0; transform: translateY(30px); } to{ opacity: 1; transform: translateY(0); } }

        /* 光泽层 */
        .box::before{
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.15), transparent);
        }
        .box:hover{
            transform: translateY(-10px) scale(1.08);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .box .num{ font-size: 32px; font-weight: 800; }
        .box .name{ font-size: 12px; opacity: 0.8; letter-spacing: 1px; }

        .box:nth-child(1){ background: linear-gradient(135deg, #ff006e, #ff4081); }
        .box:nth-child(2){ background: linear-gradient(135deg, #00f5a0, #00d9f5); }
        .box:nth-child(3){ background: linear-gradient(135deg, #f9c80e, #f8661e); }
        .box:nth-child(4){ background: linear-gradient(135deg, #7b2ff7, #f107a0); }
        .box:nth-child(5){ background: linear-gradient(135deg, #4361ee, #7209b7); }
        .box:nth-child(6){ background: linear-gradient(135deg, #06ffa5, #0aefff); }
        .box:nth-child(7){ background: linear-gradient(135deg, #ff6b6b, #ffd93d); }
        .box:nth-child(8){ background: linear-gradient(135deg, #a855f7, #6366f1); }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <h1>张耀夫的响应式布局</h1>
    <div class="subtitle">媒体查询 · 缩小窗口看列数变化</div>

    <div class="grid">
        <div class="box"><div class="num">1</div><div class="name">张耀夫</div></div>
        <div class="box"><div class="num">2</div><div class="name">张耀夫</div></div>
        <div class="box"><div class="num">3</div><div class="name">张耀夫</div></div>
        <div class="box"><div class="num">4</div><div class="name">张耀夫</div></div>
        <div class="box"><div class="num">5</div><div class="name">张耀夫</div></div>
        <div class="box"><div class="num">6</div><div class="name">张耀夫</div></div>
        <div class="box"><div class="num">7</div><div class="name">张耀夫</div></div>
        <div class="box"><div class="num">8</div><div class="name">张耀夫</div></div>
    </div>
</body>
</html>
