<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24001010903 张耀夫 - Flex弹性盒子</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background:#f8e8f2;
            padding:20px;
        }
        h2{
            margin-bottom:20px;
            font-size:26px;
            color:#d63384;
            text-align:center;
            letter-spacing:2px;
        }
        .sub{
            text-align:center;
            font-size:14px;
            color:#888;
            margin-bottom:20px;
        }
        .flex{
            display: flex;
            flex-wrap: nowrap;
            gap:30px;
        }
        .flex li{
            width:180px;
            height:220px;
            border:1px solid #333;
            list-style:none;
            display:flex;
            padding:10px;
        }

        /* ==========第1个：居中方块 · 姓名 ========== */
        .flex li:nth-child(1){
            justify-content:center;
            align-items:center;
        }
        .flex li:nth-child(1) .box{
            width:80px;
            height:80px;
            background:linear-gradient(135deg,#ff9a9e,#fad0c4);
            color:#fff;
            font-weight:bold;
            font-size:24px;
            display:flex;
            justify-content:center;
            align-items:center;
            border-radius:8px;
            box-shadow:0 4px 10px rgba(255,154,158,0.4);
        }

        /* ==========第2个：上下两个方块 · 学号 ========== */
        .flex li:nth-child(2){
            flex-direction:column;
            justify-content:center;
            align-items:center;
            gap:10px;
        }
        .flex li:nth-child(2) .box{
            width:100%;
            height:45px;
            background:linear-gradient(135deg,#a18cd1,#fbc2eb);
            color:#fff;
            font-size:14px;
            font-weight:bold;
            display:flex;
            justify-content:center;
            align-items:center;
            border-radius:8px;
            box-shadow:0 4px 10px rgba(161,140,209,0.4);
        }

        /* ==========第3个：田字格2*2 · 课程信息 ========== */
        .flex li:nth-child(3){
            flex-direction:column;
            justify-content:center;
            gap:10px;
        }
        .row{
            display:flex;
            gap:10px;
        }
        .row .box{
            flex:1;
            height:80px;
            background:linear-gradient(135deg,#89f7fe,#66a6ff);
            color:#fff;
            font-size:13px;
            font-weight:bold;
            display:flex;
            justify-content:center;
            align-items:center;
            border-radius:8px;
            box-shadow:0 4px 10px rgba(102,166,255,0.4);
        }

        /* ==========第4个：上通栏下两格 · 班级信息 ========== */
        .flex li:nth-child(4){
            flex-direction:column;
            justify-content:center;
            gap:10px;
        }
        .top-box{
            width:100%;
            height:45px;
            background:linear-gradient(135deg,#96e6a1,#d4fc79);
            color:#fff;
            font-size:14px;
            font-weight:bold;
            display:flex;
            justify-content:center;
            align-items:center;
            border-radius:8px;
            box-shadow:0 4px 10px rgba(150,230,161,0.4);
        }
        .bottom-wrap{
            display:flex;
            gap:10px;
        }
        .bottom-wrap .box{
            flex:1;
            height:55px;
            background:linear-gradient(135deg,#96e6a1,#d4fc79);
            color:#fff;
            font-size:12px;
            font-weight:bold;
            display:flex;
            justify-content:center;
            align-items:center;
            border-radius:8px;
            box-shadow:0 4px 10px rgba(150,230,161,0.4);
        }
    </style>
</head>
<body>
    <h2>张耀夫的 Flex 弹性盒子</h2>
    <p class="sub">学号 24001010903 &nbsp;|&nbsp; 班级 计算机24009 &nbsp;|&nbsp; 高级网页设计</p>
    <ul class="flex">
        <!--第1个：单个方块居中 → 姓名-->
        <li>
            <div class="box">张</div>
        </li>

        <!--第2个：上下两个方块 → 学号-->
        <li>
            <div class="box">24001010903</div>
            <div class="box">计算机24009</div>
        </li>

        <!--第3个：田字格2行2列 → 课程信息-->
        <li>
            <div class="row">
                <div class="box">高级</div>
                <div class="box">网页</div>
            </div>
            <div class="row">
                <div class="box">设计</div>
                <div class="box">Flex</div>
            </div>
        </li>

        <!--第4个：上面通栏，下面左右两个 → 班级信息-->
        <li>
            <div class="top-box">计算机24009</div>
            <div class="bottom-wrap">
                <div class="box">2024级</div>
                <div class="box">前端方向</div>
            </div>
        </li>
    </ul>
</body>
</html>
