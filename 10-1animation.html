<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-1 media query 媒体查询</title>
    <style>
        *{ margin: 0; padding: 0; }
        html{
            font-size: 16px; /* 根字号，rem基准 */
        }
        /* 全屏盒子 */
        .box{
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5rem;
            font-weight: bold;
            color: white;
            transition: background-color 0.5s ease;
        }

        /* ====== 媒体查询：视口变化背景颜色变化 ====== */
        /* 默认：大屏 >1024px 红色 */
        .box{ background-color: #e74c3c; }

        /* 中屏 768px~1024px 绿色 */
        @media (max-width: 1024px){
            .box{ background-color: #2ecc71; }
        }

        /* 小屏 480px~768px 蓝色 */
        @media (max-width: 768px){
            .box{ background-color: #3498db; }
        }

        /* 超小屏 <480px 紫色 */
        @media (max-width: 480px){
            .box{ background-color: #9b59b6; }
        }
    </style>
</head>
<body>
    <div class="box">张耀夫</div>
</body>
</html>
