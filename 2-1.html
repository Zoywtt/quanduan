<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>903 张耀夫</title>
</head>
<body>
    <h2>HTML元素:开始标签+内容+结束标记</h2>
    <h3>内容与样式相分离</h3>
    <h4>山居秋暝</h4>
    作者<br>
    <p>空山新雨后，</p>
    <p>天气晚来秋。</p>
    <p>明月松间照，</p>
    <p>清泉石上流。</p>
    <h4>93阅兵展示的武器列表</h4>
    <ul>
        <li>东风</li>
        <li>鹰击</li>
        <li>长缨</li>
        <li>巨浪</li>
        <li>霹雳</li>
    </ul>
    <!-- 注释 ctrl+/ -->
     <div style="background-color: #12abcd;width: 400px;height:200px">
        盒子
        <!-- div块级元素 -->
        <div><!-- 扩展：名字的每个字不同颜色在同一行 -->
            <!-- span行间元素，可以和其它元素在一行 -->
            <span style="color:rgb(201, 18, 24);font-size: 100px;">张</span>
            <span style="color:rgb(189, 189, 27);font-size: 100px;">耀</span>
            <span style="color:rgb(31, 22, 199);font-size: 100px;">夫</span>
            
        </div>
     </div>
</body>
</html>
