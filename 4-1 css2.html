<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>903zyf</title>
    <style>
        h2,h3,p{
            padding: 0;
            margin: 0;
        }/* 群组选择器，选择器名称为多个标签，用逗号隔开 */
        #box{
            padding: 8px;
            margin: 20px;
            border: 1px solid #ccc;
            font-size: 12px;
            width:480px;
        }
        #box h3{
            /*字体大小16px*/
            font-size: 16px;
            /*行高33px*/
            line-height: 33px;
            /*居中*/
            text-align: center;
            /*颜色#034964*/
            color: #034964;
            /*字间距3px*/
            letter-spacing: 3px;
        }
        #box p{
            /*颜色#666*/
            color: #666;
            /*首行空两格*/
            text-indent: 2em;
            /*行高150%*/
            line-height: 1.5;
        }
        #box p a{
            /*颜色#c00*/
            color: #c00;
            /*下划线*/
            text-decoration: none;
        }
        /* 扩展1：学号、姓名、班级的值蓝色加粗，用一个类选择器 */
        .info{
            color: blue;
            font-weight: bold;
        }
        /* 扩展2：h2黑底白字，居中，行高150% */
        h2{
            background-color: black;
            color: white;
            text-align: center;
            line-height: 1.5;
        }
        /* 扩展3：知识点的值蓝底白字 */
        .kw{
            background-color: blue;
            color: white;
        }
    </style>
</head>
<body>
    <h2>css群组选择器和后代选择器</h2>  
    <div id ="box">
        <h3>CSS进阶</h3>
        <p>学号：<span class="info">24001010903</span>，姓名：<span class="info">张耀夫</span>，班级：<span class="info">计算机24009</span>，《高级网页设计》设计的学习难度：中等,
            本实例的知识点：<span class="kw">CSS群组选择器和后代选择器</span>。
            <a href="#">[更多]</a>
        </p>
    </div>
</body>
</html>
