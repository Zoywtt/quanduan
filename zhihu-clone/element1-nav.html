<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页元素1 - 知乎顶部导航栏 - zyf</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        /* ============ 网页元素1：知乎顶部导航栏（作者：zyf） ============ */
        .zyf-navbar {
            display: flex;
            align-items: center;
            width: 100%;
            min-width: 850px;
            height: 52px;
            background-color: #ffffff;
            box-shadow: 0 1px 3px rgba(26, 26, 26, 0.1);
            padding: 0 24px;
        }

        /* Logo */
        .zyf-navbar .zyf-logo {
            font-size: 30px;
            font-weight: 700;
            color: #0066ff;
            letter-spacing: 2px;
            margin-right: 36px;
            line-height: 1;
        }

        /* 导航链接区 */
        .zyf-navbar .zyf-links {
            display: flex;
            align-items: center;
            height: 100%;
            margin-right: 32px;
        }

        .zyf-navbar .zyf-links a {
            display: flex;
            align-items: center;
            height: 52px;
            margin-right: 26px;
            font-size: 15px;
            color: #444;
        }

        .zyf-navbar .zyf-links a.zyf-active {
            color: #1a1a1a;
            font-weight: 600;
            position: relative;
        }

        .zyf-navbar .zyf-links a.zyf-active::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 8px;
            transform: translateX(-50%);
            width: 16px;
            height: 3px;
            border-radius: 2px;
            background-color: #0066ff;
        }

        /* 搜索框 */
        .zyf-navbar .zyf-search {
            display: flex;
            align-items: center;
            flex: 0 0 360px;
            height: 34px;
            background-color: #f6f6f6;
            border: 1px solid #ebebeb;
            border-radius: 4px;
            padding: 0 12px;
            margin-right: 16px;
        }

        .zyf-navbar .zyf-search input {
            flex: 1;
            font-size: 13px;
            color: #1a1a1a;
        }

        .zyf-navbar .zyf-search input::placeholder {
            color: #8590a6;
        }

        .zyf-navbar .zyf-search .zyf-search-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            background: none;
        }

        /* 提问按钮 */
        .zyf-navbar .zyf-ask-btn {
            height: 34px;
            padding: 0 16px;
            background-color: #0066ff;
            color: #ffffff;
            font-size: 14px;
            border-radius: 4px;
            margin-right: 24px;
        }

        /* 右侧图标区 */
        .zyf-navbar .zyf-icons {
            display: flex;
            align-items: center;
            margin-left: auto;
        }

        .zyf-navbar .zyf-icons .zyf-icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            margin-right: 10px;
            color: #8590a6;
            background: none;
        }

        .zyf-navbar .zyf-icons .zyf-avatar {
            width: 30px;
            height: 30px;
            border-radius: 3px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <!-- 网页元素1：知乎顶部导航栏（导航元素） by zyf -->
    <header class="zyf-navbar">
        <a class="zyf-logo">知乎</a>

        <nav class="zyf-links">
            <a class="zyf-active">首页</a>
            <a>会员</a>
            <a>等你来答</a>
        </nav>

        <div class="zyf-search">
            <input type="text" placeholder="为什么重庆被称为 8D 魔幻城市？">
            <button class="zyf-search-btn" aria-label="搜索">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="#8590a6" stroke-width="2" stroke-linecap="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
                </svg>
            </button>
        </div>

        <button class="zyf-ask-btn">提问</button>

        <div class="zyf-icons">
            <button class="zyf-icon-btn" aria-label="消息">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.7 21a2 2 0 0 1-3.4 0"></path>
                </svg>
            </button>
            <button class="zyf-icon-btn" aria-label="私信">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
            </button>
            <img class="zyf-avatar" alt="我的头像"
                 src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=flat%20illustration%20avatar%20of%20a%20young%20chinese%20man%2C%20minimal%20style%2C%20solid%20color%20background&image_size=square">
        </div>
    </header>

    <p class="zyf-demo-title">网页元素 1 · 知乎顶部导航栏 · zyf</p>
</body>
</html>
